name: waoon

services:
  # PostgreSQL 15 + 拡張同梱（自前 Dockerfile）。RLS / pgmq / pg_cron / pgvector / pgtap。
  postgres:
    build:
      context: ./data
      dockerfile: Dockerfile.db
    image: waoon-postgres:15
    container_name: waoon-postgres
    environment:
      POSTGRES_USER: ${PG_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${PG_SUPERUSER_PASSWORD:-postgres}
      POSTGRES_DB: ${PG_DATABASE:-waoon}
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      # 初回起動時のブートストラップ（ロール/スキーマ/拡張/RLS ヘルパ）。gotrue 接続前提を満たす。
      - ../outputs/infra-data/schema/00_bootstrap.sql:/docker-entrypoint-initdb.d/00_bootstrap.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_SUPERUSER:-postgres} -d ${PG_DATABASE:-waoon}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [waoon]

  # GoTrue（認証エンジン）。auth スキーマのみを supabase_auth_admin で操作。
  gotrue:
    image: supabase/auth:v2.189.0
    container_name: waoon-gotrue
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: "postgres://supabase_auth_admin:${AUTH_ADMIN_PASSWORD:-authadmin}@postgres:5432/${PG_DATABASE:-waoon}?search_path=auth&sslmode=disable"
      GOTRUE_SITE_URL: ${SITE_URL:-http://localhost:3000}
      API_EXTERNAL_URL: ${API_EXTERNAL_URL:-http://localhost:9999}
      GOTRUE_API_HOST: 0.0.0.0
      PORT: "9999"
      GOTRUE_JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-please-32bytes-minimum}
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      # 管理者がユーザーを発行する運用（公開サインアップは無効）
      GOTRUE_DISABLE_SIGNUP: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_LOG_LEVEL: info
    ports:
      - "${GOTRUE_PORT:-9999}:9999"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [waoon]

  # MinIO（S3 互換オブジェクトストレージ）。添付ファイルを presigned URL でブラウザ直 up/down。
  minio:
    image: minio/minio:latest
    container_name: waoon-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    networks: [waoon]

  # 起動後にバケットを作る（冪等）。minio が接続を受け付けるまで alias 設定をリトライする。
  minio-setup:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin}; do echo 'waiting for minio'; sleep 1; done;
      mc mb --ignore-existing local/${STORAGE_BUCKET:-waoon};
      echo 'bucket ready';
      "
    networks: [waoon]

volumes:
  db-data:
  minio-data:

networks:
  waoon:
    name: waoon
