name: wanonwan

services:
  # PostgreSQL 15 + 拡張同梱（自前 Dockerfile）。RLS / pgmq / pg_cron / pgvector / pgtap。
  postgres:
    build:
      context: ./data
      dockerfile: Dockerfile.db
    image: wanonwan-postgres:15
    container_name: wanonwan-postgres
    environment:
      POSTGRES_USER: ${PG_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${PG_SUPERUSER_PASSWORD:-postgres}
      POSTGRES_DB: ${PG_DATABASE:-wanonwan}
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      # 初回起動時のブートストラップ（ロール/スキーマ/拡張/RLS ヘルパ）。gotrue 接続前提を満たす。
      - ../packages/db/schema/00_bootstrap.sql:/docker-entrypoint-initdb.d/00_bootstrap.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_SUPERUSER:-postgres} -d ${PG_DATABASE:-wanonwan}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [wanonwan]

  # GoTrue（認証エンジン）。auth スキーマのみを supabase_auth_admin で操作。
  gotrue:
    image: supabase/auth:v2.189.0
    container_name: wanonwan-gotrue
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: "postgres://supabase_auth_admin:${AUTH_ADMIN_PASSWORD:-authadmin}@postgres:5432/${PG_DATABASE:-wanonwan}?search_path=auth&sslmode=disable"
      GOTRUE_SITE_URL: ${SITE_URL:-http://localhost:3000}
      API_EXTERNAL_URL: ${API_EXTERNAL_URL:-http://localhost:9999}
      GOTRUE_API_HOST: 0.0.0.0
      PORT: "9999"
      GOTRUE_JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-please-32bytes-minimum}
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      # 管理者がユーザーを発行する運用（公開サインアップは無効）
      GOTRUE_DISABLE_SIGNUP: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_LOG_LEVEL: info
    ports:
      - "${GOTRUE_PORT:-9999}:9999"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [wanonwan]

  # MinIO（S3 互換オブジェクトストレージ）。添付ファイルを presigned URL でブラウザ直 up/down。
  minio:
    image: minio/minio:latest
    container_name: wanonwan-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    networks: [wanonwan]
  # バケット作成は compose の one-shot にしない（`up --wait` が exit したコンテナを失敗扱いにするため）。
  # アプリ側 lib/storage の ensureBucket() が初回アップロード時に冪等に作成する。

  # 自前ホスト埋め込み（AI メンター提案の RAG 用）。データを社外に出さずベクトル化する。
  # profile "ai" 限定 = 既定の compose:dev:up / CI では起動しない（モデル DL で重くなるため）。
  # 使うとき: pnpm compose:ai:up（--profile ai）。日本語対応の multilingual-e5-small（384次元）。
  embeddings:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-latest
    container_name: wanonwan-embeddings
    profiles: ["ai"]
    command: ["--model-id", "intfloat/multilingual-e5-small"]
    ports:
      - "${EMBEDDINGS_PORT:-8081}:80"
    volumes:
      - embeddings-data:/data
    networks: [wanonwan]

volumes:
  db-data:
  minio-data:
  embeddings-data:

networks:
  wanonwan:
    name: wanonwan
