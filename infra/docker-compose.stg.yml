# staging スタック（postgres + gotrue + web + nginx）。
# dev (docker-compose.yml) と同型だが web/nginx を載せ、secrets の dev フォールバックを撤去。
# 起動: pnpm compose:stg:up（先に scripts/check-secrets.mjs が走る）
# 値は --env-file infra/.env.stg 由来。未設定 secret は ${VAR:?...} で起動失敗する（B-2）。
name: waoon-stg

services:
  # PostgreSQL 15 + 拡張同梱。ネットワーク非公開（ports を出さない＝compose 内部のみ）。
  postgres:
    build:
      context: ./data
      dockerfile: Dockerfile.db
    image: waoon-postgres:15
    container_name: waoon-stg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_SUPERUSER:?PG_SUPERUSER required}
      POSTGRES_PASSWORD: ${PG_SUPERUSER_PASSWORD:?PG_SUPERUSER_PASSWORD required}
      POSTGRES_DB: ${PG_DATABASE:?PG_DATABASE required}
      # initdb の 05_rotate_roles.sh が内部ロール password を env 由来へ rotate する（B-2）。
      AUTH_ADMIN_PASSWORD: ${AUTH_ADMIN_PASSWORD:?AUTH_ADMIN_PASSWORD required}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD required}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ../outputs/infra-data/schema/00_bootstrap.sql:/docker-entrypoint-initdb.d/00_bootstrap.sql:ro
      - ./data/05_rotate_roles.sh:/docker-entrypoint-initdb.d/05_rotate_roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_SUPERUSER} -d ${PG_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [waoon]

  # GoTrue（認証エンジン）。直接公開せず nginx 経由でのみ到達。
  gotrue:
    image: supabase/auth:v2.189.0
    container_name: waoon-stg-gotrue
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: "postgres://supabase_auth_admin:${AUTH_ADMIN_PASSWORD:?AUTH_ADMIN_PASSWORD required}@postgres:5432/${PG_DATABASE}?search_path=auth&sslmode=disable"
      GOTRUE_SITE_URL: ${SITE_URL:?SITE_URL required}
      API_EXTERNAL_URL: ${API_EXTERNAL_URL:?API_EXTERNAL_URL required}
      GOTRUE_API_HOST: 0.0.0.0
      PORT: "9999"
      GOTRUE_JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_DISABLE_SIGNUP: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_LOG_LEVEL: info
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [waoon]

  # apps/web（Next.js standalone）。GHCR の image を pull。
  web:
    image: ${WEB_IMAGE:?WEB_IMAGE required}:${WEB_IMAGE_TAG:?WEB_IMAGE_TAG required}
    container_name: waoon-stg-web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      gotrue:
        condition: service_healthy
    environment:
      NODE_ENV: production
      # app_user の password は env secret から組み立てる（dev 固定値を残さない）。
      DATABASE_URL: postgres://app_user:${APP_DB_PASSWORD:?APP_DB_PASSWORD required}@postgres:5432/${PG_DATABASE}
      GOTRUE_URL: ${GOTRUE_URL:?GOTRUE_URL required}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      # 添付（MinIO）。presigned URL は browser-reachable な公開ホストで署名する必要があるため
      # STORAGE_ENDPOINT は nginx 経由の storage サブドメイン（https://storage.<domain>）。
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:?STORAGE_ENDPOINT required}
      STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER required}
      STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD required}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-waoon}
    networks: [waoon]

  # MinIO（添付のオブジェクトストレージ）。直接公開せず nginx(storage サブドメイン)経由のみ。
  minio:
    image: minio/minio:latest
    container_name: waoon-stg-minio
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD required}
    volumes:
      - minio-data:/data
    networks: [waoon]

  # 添付 GC worker。pgmq の attachment_gc をドレインして MinIO 本体を削除する。公開ポートなし。
  worker:
    image: ${WORKER_IMAGE:?WORKER_IMAGE required}:${WORKER_IMAGE_TAG:?WORKER_IMAGE_TAG required}
    container_name: waoon-stg-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      NODE_ENV: production
      # pgmq の read/delete に特権が要るため superuser 接続（保守デーモン）。
      DATABASE_URL: postgres://${PG_SUPERUSER}:${PG_SUPERUSER_PASSWORD:?PG_SUPERUSER_PASSWORD required}@postgres:5432/${PG_DATABASE}
      # worker は presign せず内部 MinIO へ直接 DeleteObject（公開 storage サブドメインは使わない）。
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER required}
      STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD required}
    networks: [waoon]

  # nginx（TLS 終端・ルーティング・XFF 注入・一次レートリミット）。設定は ./nginx を参照。
  nginx:
    image: nginx:1.27-alpine
    container_name: waoon-stg-nginx
    restart: unless-stopped
    depends_on:
      - web
      - gotrue
      - minio
    ports:
      - "80:80"
      - "443:443"
    environment:
      WAOON_DOMAIN: ${WAOON_DOMAIN:?WAOON_DOMAIN required}
      # 添付の storage サブドメイン（既定 storage.<domain>）。cert の SAN に含めること。
      WAOON_STORAGE_DOMAIN: ${WAOON_STORAGE_DOMAIN:?WAOON_STORAGE_DOMAIN required}
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/conf.d/10-limits.conf:/etc/nginx/conf.d/10-limits.conf:ro
      - certbot-conf:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot
    networks: [waoon]

  # certbot（Let's Encrypt 自動更新）。初回発行は infra/nginx/README.md の手順を参照。
  certbot:
    image: certbot/certbot:latest
    container_name: waoon-stg-certbot
    restart: unless-stopped
    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    # 12h ごとに更新を試みる（更新が無ければ no-op）。
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done'

volumes:
  db-data:
  certbot-conf:
  certbot-www:
  minio-data:

networks:
  waoon:
    name: waoon-stg
