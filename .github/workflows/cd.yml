name: CD

# develop → stg、main → prod へデプロイ（D-2: push 型 GHCR）。
# image を GHCR に build/push → host へ SSH して compose pull + ordered up + migration。
on:
  push:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/waoon-web
  IMAGE_WORKER: ghcr.io/${{ github.repository_owner }}/waoon-worker

jobs:
  build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # branch 名タグ（develop / main→latest）と sha タグの両方を付ける。
      # compose の WEB_IMAGE_TAG は branch/latest を参照し、sha タグは監査・ロールバック用。
      - name: Compute tags
        id: tags
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "moving=latest" >> "$GITHUB_OUTPUT"
          else
            echo "moving=develop" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push (web)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile.web
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.tags.outputs.moving }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Build and push (worker)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile.worker
          push: true
          tags: |
            ${{ env.IMAGE_WORKER }}:${{ steps.tags.outputs.moving }}
            ${{ env.IMAGE_WORKER }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # secrets が揃っている環境のみ。未配備なら deploy はスキップ（build/push までは走る）。
    environment: ${{ github.ref_name == 'main' && 'prod' || 'stg' }}
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # host 側: リポジトリ clone 済み（compose/SQL を git で取得）。node + docker 前提。
          # CD 順序を固定: pull → postgres/gotrue up → healthcheck → migration → web/nginx up。
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"

            if [ "${{ github.ref_name }}" = "main" ]; then
              ENV_FILE=infra/.env.prod
              COMPOSE=infra/docker-compose.prod.yml
            else
              ENV_FILE=infra/.env.stg
              COMPOSE=infra/docker-compose.stg.yml
            fi
            dc() { docker compose --env-file "$ENV_FILE" -f "$COMPOSE" "$@"; }

            # host 側 working tree のローカル変更に阻まれないよう -f / reset --hard で確実に同期。
            # 実値 env（infra/.env.{stg,prod}）は .gitignore 済み = git 管理外なので host に事前配置しておく。
            git fetch --prune origin
            git checkout -f "${{ github.ref_name }}"
            git reset --hard "origin/${{ github.ref_name }}"

            # 起動前に dev フォールバック secret が無いことを確認（B-2 grep ガード）。
            node scripts/check-secrets.mjs "$ENV_FILE"

            # 1) remote image を取得（postgres は build 専用なので pull 対象から外す）
            dc pull --ignore-buildable
            dc build postgres

            # 2) DB と認証を起動し healthy を待つ（initdb の 05_rotate_roles.sh で role password rotate 済み）
            dc up -d postgres gotrue
            # 初回 initdb（bootstrap + rotate + 拡張作成）は時間がかかるので余裕を持って待つ。
            for i in $(seq 1 60); do
              if dc exec -T postgres pg_isready -U "$(grep -E '^PG_SUPERUSER=' "$ENV_FILE" | cut -d= -f2)" >/dev/null 2>&1; then
                echo "postgres ready"; break
              fi
              [ "$i" = "60" ] && { echo "postgres not ready"; exit 1; }
              sleep 2
            done

            # 3) migration（web 起動前。失敗したら web を上げずに止まる）
            node scripts/db-migrate.mjs --compose-file "$COMPOSE" --env-file "$ENV_FILE"

            # 4) web/worker/nginx を起動（worker は migration 後＝pgmq キュー作成済みで起動）
            dc up -d web worker nginx

            dc ps
