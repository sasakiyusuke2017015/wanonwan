name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

# 同一ブランチの古い実行はキャンセル
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # pnpm のバージョンは package.json の packageManager から取る（重複指定しない）
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # typecheck / lint / build / test を turbo で集約実行（依存グラフ順 + キャッシュ）
      - name: Verify (turbo)
        run: pnpm turbo run typecheck lint build test

      # dashboard drift 検査: outputs/README.md == Plan ヘッダから生成した内容。
      # Plan ヘッダを更新して README 再生成を忘れると落ちる（README は生成物）。
      # node だけで済むので、DB スタックを立てる前に早く失敗させる。
      - name: Dashboard drift check
        run: node scripts/gen-outputs-readme.mjs --check

      # --- DB スタックを立てて pgTAP（RLS）を実行 ---
      # compose も scripts も env に既定値を持たないため、dev 用 env を実体化してから起動する。
      - name: Materialize dev env
        run: cp infra/.env.example infra/.env

      - name: Build DB image
        run: pnpm compose:dev:build

      # snapshot drift 検査: migrations を空 DB へ順次適用した結果 == コミット済み snapshot。
      # migration を足して snapshot 再生成を忘れると差分が出て落ちる（snapshot は生成物）。
      - name: Snapshot drift check
        run: |
          pnpm db:snapshot
          git diff --exit-code -- packages/db/snapshot/schema.sql \
            || { echo "::error::snapshot が migrations と不一致。pnpm db:snapshot を実行してコミットしてください"; exit 1; }

      # --wait が postgres の healthcheck（pg_isready）成功まで待つ。
      - name: Start DB stack
        run: docker compose --env-file infra/.env -f infra/docker-compose.yml up -d --wait

      - name: Migrate
        run: pnpm db:migrate

      - name: Seed
        run: pnpm provision:dev

      - name: pgTAP (RLS)
        run: pnpm test:db

      - name: Stop DB stack
        if: always()
        run: pnpm compose:dev:down
