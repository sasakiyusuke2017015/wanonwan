name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

# 同一ブランチの古い実行はキャンセル
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # pnpm のバージョンは package.json の packageManager から取る（重複指定しない）
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # typecheck / lint / build / test を turbo で集約実行（依存グラフ順 + キャッシュ）
      - name: Verify (turbo)
        run: pnpm turbo run typecheck lint build test

      # --- DB スタックを立てて pgTAP（RLS）を実行 ---
      - name: Build DB image
        run: pnpm compose:dev:build

      # snapshot drift 検査: migrations を空 DB へ順次適用した結果 == コミット済み snapshot。
      # migration を足して snapshot 再生成を忘れると差分が出て落ちる（snapshot は生成物）。
      - name: Snapshot drift check
        run: |
          pnpm db:snapshot
          git diff --exit-code -- packages/db/snapshot/schema.sql \
            || { echo "::error::snapshot が migrations と不一致。pnpm db:snapshot を実行してコミットしてください"; exit 1; }

      - name: Start DB stack
        run: docker compose -f infra/docker-compose.yml up -d --wait

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            if docker compose -f infra/docker-compose.yml exec -T postgres pg_isready -U postgres -d wanonwan; then
              echo "postgres ready"; exit 0
            fi
            sleep 2
          done
          echo "postgres not ready"; exit 1

      - name: Migrate
        run: pnpm db:migrate

      - name: Seed
        run: pnpm provision:dev

      - name: pgTAP (RLS)
        run: pnpm test:db

      - name: Stop DB stack
        if: always()
        run: pnpm compose:dev:down
